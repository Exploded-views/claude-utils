# FORK-ONLY CHANGE. Upstream's release.yml built and archived inline. This fork
# moves that loop into scripts/package-release.sh so every archive also carries
# scripts/bootstrap.sh (claude-utils-<tag>-<os>-<arch>/scripts/bootstrap.sh) and
# SHA256SUMS covers it; fork-ci.yml's release-layout job tests the same script.
# Do not propose this file's change upstream as is.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and upload archives for (e.g. v0.1.7)'
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Build and upload archives
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CGO_ENABLED: 0
    steps:
      - name: Check the tag name
        env:
          VERSION: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          case "${VERSION}" in
            v[0-9]*) ;;
            *) echo "::error::tag must look like vX.Y.Z"; exit 1 ;;
          esac
          if printf '%s' "${VERSION}" | grep -q '[^A-Za-z0-9._+-]'; then
            echo "::error::tag has unexpected characters"; exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          # No build cache for release artifacts: a poisoned cache must not reach a release.
          cache: false

      - name: Build cross-platform archives
        env:
          VERSION: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          bash scripts/package-release.sh "${VERSION}" dist
          # Fork-only: every archive also carries scripts/bootstrap.sh.

      - name: Upload archives to release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.release.tag_name || inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          gh release upload "${VERSION}" \
            dist/*.zip dist/*.tar.gz dist/SHA256SUMS \
            --repo "${REPO}"
